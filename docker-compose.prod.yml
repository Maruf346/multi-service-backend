name: goswift-backend

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: goswift-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/goswift.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    networks:
      - goswift

  web:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: goswift-web
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      WAIT_FOR_DATABASE: "true"
      RUN_COLLECTSTATIC: "true"
      RUN_MIGRATIONS: "true"
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      - redis
    networks:
      - goswift

  celery_worker:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: goswift-celery-worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      WAIT_FOR_DATABASE: "true"
      RUN_COLLECTSTATIC: "false"
      RUN_MIGRATIONS: "false"
    command: celery -A core worker --loglevel=INFO
    depends_on:
      - redis
      - web
    networks:
      - goswift

  celery_beat:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: goswift-celery-beat
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      WAIT_FOR_DATABASE: "true"
      RUN_COLLECTSTATIC: "false"
      RUN_MIGRATIONS: "false"
    command: celery -A core beat --loglevel=INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - redis
      - web
    networks:
      - goswift

  redis:
    image: redis:7.4-alpine
    container_name: goswift-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - goswift

volumes:
  static_volume:
  redis_data:

networks:
  goswift:
    name: goswift
